[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nolitisea"
version = "0.1.0"
description = "Nonlinear time series analysis toolkit"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
fast = ["numba>=0.56"]
plot = ["matplotlib>=3.5"]
nn = ["torch>=2.0"]
node = ["torch>=2.0", "torchdiffeq>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]
